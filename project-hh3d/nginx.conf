server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;

    # ═══════════════════════════════════════════════════════════════════
    # Frontend - SPA routing (React/Vite)
    # ═══════════════════════════════════════════════════════════════════
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Add security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ═══════════════════════════════════════════════════════════════════
    # API Proxy to Backend
    # ═══════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Caching
        proxy_cache_bypass $http_pragma $http_authorization;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Static Images - Proxy to Backend OR External URLs
    # ═══════════════════════════════════════════════════════════════════
    location ~ ^/image/(https?://.+)$ {
        # Para URLs externas (https://... ou http://...)
        set $external_url $1;
        proxy_pass $external_url;
        proxy_ssl_verify off;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    
    location /image/ {
        # Para imagens locais - proxy to backend
        proxy_pass http://backend:5000;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Common Security Headers
    # ═══════════════════════════════════════════════════════════════════
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self' https://www.youtube.com https://drive.google.com; connect-src 'self' http://backend:5000 localhost:5000; font-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

